[project]
name = "deephierarchy"
version = "0.1.0"
authors = [
    {name = "Baptiste Esteban", email = "baptiste.esteban@epita.fr"}
]
requires-python = ">=3.13"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I"]